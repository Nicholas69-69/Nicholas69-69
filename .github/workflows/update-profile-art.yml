name: Update profile art

# quote 'on' so YAML doesn't read it as the boolean true
"on":
  schedule:
    - cron: "17 6 * * *"     # ~06:17 UTC daily (08:17 SAST)
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write             # allow the bot to commit the refreshed SVG

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the scraper deps — the portrait pipeline isn't needed daily.
      - name: Install deps
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
